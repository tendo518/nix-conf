# Mihomo runtime config template. mihomo-ctl replaces $MODE and the
# subscription placeholders at runtime: one provider and two groups per saved
# subscription, plus the exit file provider rendered by `mihomo-ctl exit`.
# Never put a real subscription URL or exit node in this file.

mixed-port: 7890

mode: $MODE
log-level: info
allow-lan: false
ipv6: true

external-controller: 127.0.0.1:9090

profile:
  store-selected: true

tun:
  enable: true
  stack: system
  device: mihomo
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false
  dns-hijack: []

dns:
  enable: false

sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443

proxy-providers:
  # Rendered from the runtime state; every entry is an exit node that sends
  # traffic to a remote proxy instead of a subscription's nodes.
  exit:
    type: file
    path: ./exits.yaml

  # One provider per saved subscription, rendered from the encrypted state.
$SUBSCRIPTION_PROVIDERS

proxy-groups:
  # Used when the Mihomo mode is global. It follows OUTBOUND so `mihomo-ctl
  # outbound` picks the outbound for both modes.
  - name: GLOBAL
    type: select
    proxies:
      - OUTBOUND

  # The outbound switch: every subscription and every exit node is a sibling
  # entry here (`mihomo-ctl outbound`).
  - name: OUTBOUND
    type: select
    proxies:
$OUTBOUND_SUBSCRIPTIONS
    use:
      - exit

  # One selector plus one url-test group per subscription, so each subscription
  # keeps its own node choice (`mihomo-ctl proxy node`).
$SUBSCRIPTION_GROUPS

rules:
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,cn_ip,DIRECT,no-resolve
  - MATCH,OUTBOUND

rule-providers:
  private_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./providers/rules/private_domain.mrs
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"

  cn_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./providers/rules/cn_domain.mrs
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs"

  private_ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    path: ./providers/rules/private_ip.mrs
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs"

  cn_ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    path: ./providers/rules/cn_ip.mrs
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs"
