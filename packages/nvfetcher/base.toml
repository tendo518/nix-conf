[coteditor]
src.github = "coteditor/CotEditor"
fetch.url = "https://github.com/coteditor/CotEditor/releases/download/$ver/CotEditor_$ver.dmg"

[deepseek-harness]
# The desktop updater's stable-channel manifest on the same origin as the zip;
# GitHub tags run ahead of published artifacts, this feed does not.
src.webpage = "https://download.deepseek.com/dsh-desk/feeds/mac-arm64/stable-mac.yml"
src.regex = "version: ([0-9][0-9A-Za-z.+-]*)"
fetch.url = "https://download.deepseek.com/dsh-desk/bin/mac-arm64/stable/deepseek-harness-$ver-mac-arm64.zip"

[deskflow-arm64]
src.github = "deskflow/deskflow"
src.prefix = "v"
fetch.url = "https://github.com/deskflow/deskflow/releases/download/v$ver/deskflow-$ver-macos-arm64.dmg"

