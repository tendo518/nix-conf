version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 18 * * *"  # 18:00 UTC = 02:00 CST (Asia/Shanghai, UTC+8) every day incl. weekends
      
    groups:
      nix-updates:
        patterns:
          - "*" # 匹配所有的 Nix flake inputs
