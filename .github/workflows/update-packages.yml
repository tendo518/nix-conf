name: Update pinned packages

on:
  schedule:
    # Every third day at 19:00 UTC = 03:00 Asia/Shanghai,
    # one hour after the dependabot nix update cron.
    - cron: "0 19 */3 * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Optional package directory to update (leave empty for all)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Update package metadata
        env:
          PACKAGE: ${{ github.event.inputs.package || '' }}
        run: |
          if [ -n "${PACKAGE:-}" ]; then
            bash packages/update.sh "$PACKAGE"
          else
            bash packages/update.sh
          fi

      - name: Create or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: "chore(packages): update pinned packages"
          branch: chore/update-packages
          delete-branch: true
          title: "chore(packages): update pinned packages"
          body: |
            Automatically generated by the scheduled package update workflow.

            Auto-merge is enabled; GitHub will merge this PR once all
            required checks pass.
          labels: dependencies
          add-paths: |
            packages/

      - name: Enable auto-merge for package update PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-url }}"
