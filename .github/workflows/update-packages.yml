name: Update pinned packages

on:
  schedule:
    # Every day at 19:00 UTC = 03:00 Asia/Shanghai,
    # one hour after the dependabot nix update cron.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Delete branches from closed pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          closed_branches="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --limit 1000 \
            --json headRefName,state \
            --jq '.[] | select(.state == "MERGED" or .state == "CLOSED") | .headRefName')"

          gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name' |
            while IFS= read -r branch; do
              case "$branch" in
                chore/update-packages-* | dependabot/nix/*) ;;
                *) continue ;;
              esac

              if printf '%s\n' "$closed_branches" | grep -Fxq "$branch"; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              fi
            done

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Update package sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 packages/nvfetcher/dynamic.py "$RUNNER_TEMP/nvfetcher.toml"

          printf '[keys]\ngithub = "%s"\n' "$GITHUB_TOKEN" \
            > "$RUNNER_TEMP/nvchecker-key.toml"

          nix run nixpkgs#nvfetcher -- \
            --config "$RUNNER_TEMP/nvfetcher.toml" \
            --build-dir packages/_sources \
            --keyfile "$RUNNER_TEMP/nvchecker-key.toml" \
            --retry 3 \
            --keep-going

      - name: Validate generated package set
        run: nix flake check --no-build --all-systems

      - name: Create or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: "chore(packages): update pinned packages"
          branch: chore/update-packages-${{ github.run_id }}
          delete-branch: true
          title: "chore(packages): update pinned packages"
          body: |
            Automatically generated by the scheduled package update workflow.

            Auto-merge is enabled; GitHub will merge this PR once all
            required checks pass.
          labels: dependencies
          add-paths: |
            packages/

      - name: Enable auto-merge for package update PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-url }}"
